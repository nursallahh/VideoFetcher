name: Video Fetcher CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore & Build
        run: dotnet build VideoFetcher.sln --configuration Release
      - name: Run Unit Tests
        run: dotnet test tests/VideoFetcher.UnitTests/VideoFetcher.UnitTests.csproj --configuration Release --no-build --verbosity normal
